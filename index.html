<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Make-a-Ring</title>
    <meta name="description" content="Design a custom, print-ready ring: mix patterns, draw your own, try it on and download files." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='17' rx='11' ry='11' fill='none' stroke='%231d1b19' stroke-width='3.4'/%3E%3Cpath d='M16 2.5l3.2 3.6-3.2 3.6-3.2-3.6Z' fill='%23b5862f'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="technical.css" />
    <link rel="stylesheet" href="tour.css" />
    <link rel="stylesheet" href="editor.css" />
    <script>
      // Theme and device are set before first paint to avoid a flash.
      (function () {
        var d = document.documentElement, t = 'beige';
        try { t = localStorage.getItem('mar.theme') || 'beige'; } catch (e) {}
        d.dataset.theme = t;
        try { d.dataset.grid = localStorage.getItem('mar.grid') || 'on'; } catch (e) { d.dataset.grid = 'on'; }
        function device() {
          var coarse = matchMedia('(pointer: coarse)').matches, w = innerWidth;
          d.dataset.device = w < 700 ? 'phone' : coarse || w < 1180 ? 'tablet' : 'desktop';
          d.dataset.input = coarse ? 'touch' : 'mouse';
        }
        device();
        addEventListener('resize', device);
      })();
    </script>
    <script type="importmap">
      {
        "imports": {
          "preact": "https://cdn.jsdelivr.net/npm/preact@10.24.3/dist/preact.module.js",
          "preact/hooks": "https://cdn.jsdelivr.net/npm/preact@10.24.3/hooks/dist/hooks.module.js",
          "htm": "https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.module.js",
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Make-a-Ring needs JavaScript to run the 3D designer.</noscript>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
